name: Build and Deploy Tree Website to GitHub Pages

on:
  push:
    paths:
      - 'website-generator/data/**'
      - 'data/**'
      - 'website-generator/src/**'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Copy data if located at root
        run: |
          mkdir -p website-generator/data
          if [ -d "data" ]; then
            cp -r data/* website-generator/data/ || true
          fi

      - name: Run Website Generator
        working-directory: website-generator
        run: |
          chmod +x gradlew || true
          gradle run --no-daemon

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website-generator/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
