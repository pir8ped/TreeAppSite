name: Build and Deploy Tree Website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure data directory exists
        run: |
          mkdir -p website-generator/data
          if [ -d "data" ] && [ "$(ls -A data)" ]; then
            cp -r data/* website-generator/data/
          fi

      - name: Run Website Generator
        working-directory: website-generator
        run: |
          chmod +x gradlew
          ./gradlew run --no-daemon

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'website-generator/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
